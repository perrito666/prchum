name: Release

on:
  push:
    tags: ["v*"]

# The release step publishes with the built-in GITHUB_TOKEN via the gh
# CLI the runner ships — no third-party release action to pin or trust.
permissions:
  contents: write

# Cost note: macOS minutes bill at 10x, but a release is rare and needs
# a Mac end to end (release core, release Swift build, icns, ditto).
jobs:
  release:
    name: Build app & publish release
    runs-on: macos-15
    # Code signing and notarization switch on by themselves once the
    # secrets exist (Settings → Secrets and variables → Actions).
    # Always needed:
    #   MACOS_CERTIFICATE_P12      Developer ID Application cert, base64 of the .p12
    #   MACOS_CERTIFICATE_PASSWORD the .p12's password
    # Plus ONE way to talk to the notary service — either an App Store
    # Connect API key (Apple's recommended automation auth):
    #   APPLE_API_KEY_P8           the .p8 contents
    #   APPLE_API_KEY_ID           its Key ID
    #   APPLE_API_ISSUER_ID        the issuer UUID
    # …or a plain Apple ID with an app-specific password:
    #   APPLE_ID                   the account email
    #   APPLE_APP_SPECIFIC_PASSWORD  from account.apple.com
    #   APPLE_TEAM_ID              the 10-character team id
    # Until then the steps skip and the zip ships unsigned.
    env:
      HAVE_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && (secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_APP_SPECIFIC_PASSWORD != '') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: Test before shipping
        run: make check

      - name: Build the app bundle
        run: make app

      - name: Stamp the tag's version into the bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" dist/Prchum.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" dist/Prchum.app/Contents/Info.plist

      - name: Sign the app
        if: env.HAVE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          test -n "$IDENTITY"
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" dist/Prchum.app
          codesign --verify --deep --strict dist/Prchum.app

      - name: Notarize and staple
        if: env.HAVE_SIGNING == 'true'
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/Prchum.app "$RUNNER_TEMP/notarize.zip"
          if [ -n "$API_KEY_P8" ]; then
            echo "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" \
              --issuer "$API_ISSUER_ID" --wait
          else
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait
          fi
          xcrun stapler staple dist/Prchum.app

      - name: Zip the bundle
        # ditto preserves the bundle structure and extended attributes
        # the way Archive Utility expects.
        run: |
          ditto -c -k --keepParent dist/Prchum.app "Prchum-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "Prchum-${GITHUB_REF_NAME}.zip" > "Prchum-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAVE_SIGNING" = "true" ]; then
            MAC_NOTE="Signed and notarized — download, unzip, and double-click; requires macOS 14+ on Apple Silicon."
          else
            MAC_NOTE="The app is not code-signed — on first launch, right-click Prchum.app and choose Open (or clear quarantine with \`xattr -d com.apple.quarantine Prchum.app\`); requires macOS 14+ on Apple Silicon."
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Prchum $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$MAC_NOTE Reviewing pull requests needs the forge CLI installed and authenticated: gh for GitHub, fj for Forgejo." \
            "Prchum-${GITHUB_REF_NAME}.zip" \
            "Prchum-${GITHUB_REF_NAME}.zip.sha256"
