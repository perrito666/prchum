name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Core tests and header drift run on Linux: the core is portable and
  # Linux minutes are cheap.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --manifest-path core/Cargo.toml
      - name: Header drift
        run: |
          cargo build --release --manifest-path core/Cargo.toml
          git diff --exit-code macos/Sources/CPrchum/include/prchum.h

  # The Swift ↔ core boundary is exercised headlessly on a macOS runner.
  smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build without warnings
        run: make strict

      - name: Smoke test
        run: make smoke

  # The GTK shell builds on every change, because it links the core as a
  # crate: a change there that breaks it would otherwise be found only
  # by someone on Linux, long afterwards.
  linux-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: GTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: Build
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --manifest-path linux/Cargo.toml
